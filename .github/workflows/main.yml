name: Ghidra Automated Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ghidra-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Ghidra İndir ve Ayıkla
      run: |
        GHIDRA_VERSION="11.2.1_PUBLIC"
        GHIDRA_DATE="20241105"
        wget https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_${GHIDRA_DATE}.zip
        unzip -q ghidra_${GHIDRA_VERSION}_${GHIDRA_DATE}.zip
        echo "GHIDRA_HOME=$PWD/ghidra_${GHIDRA_VERSION}" >> $GITHUB_ENV

    - name: Headless Analiz Çalıştır
      run: |
        # Hedef dosyanın repoda 'target/binary' yolunda olduğunu varsayıyoruz
        # Örnek olarak analiz sonuçlarını /tmp dizinine çıkartıyoruz
        mkdir -p /tmp/ghidra_out
        
        $GHIDRA_HOME/support/analyzeHeadless /tmp/ghidra_project TempAnalysisProject \
          -import ./target/superbear.dylib \
          -analyze \
          -output /tmp/ghidra_out
      
    - name: Sonuçları Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ghidra-analysis-report
        path: /tmp/ghidra_out/
