name: Ghidra Automated Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ghidra-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Setup Ghidra
      run: |
        GHIDRA_VERSION="11.2.1"
        GHIDRA_DATE="20241105"
        wget https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip
        unzip -q ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip
        echo "GHIDRA_HOME=$PWD/ghidra_${GHIDRA_VERSION}_PUBLIC" >> $GITHUB_ENV

    - name: URL ve Dosya Adını Oku ve İndir
      run: |
        
        if [ -s Dumpfile/bigfile_url.txt ]; then
          # url= ve ad= değerlerini çekip tırnak işaretlerini, boşlukları ve satır sonlarını temizle
          URL_VAL=$(grep '^url=' Dumpfile/bigfile_url.txt | cut -d'=' -f2- | tr -d '\r' | tr -d '"' | tr -d "'" | xargs)
          NAME_VAL=$(grep '^ad=' Dumpfile/bigfile_url.txt | cut -d'=' -f2- | tr -d '\r' | tr -d '"' | tr -d "'" | xargs)
          
          # URL boşsa, "default" ise veya "DEFAULT" ise indirmeyi atla
          if [ -n "$URL_VAL" ] && [ "$URL_VAL" != "default" ] && [ "$URL_VAL" != "DEFAULT" ]; then
            if [ -z "$NAME_VAL" ]; then
              NAME_VAL=$(basename "$URL_VAL" | cut -d? -f1)
              if [ -z "$NAME_VAL" ]; then
                NAME_VAL="OyunBinary"
              fi
            fi
            
            echo "Dosya indiriliyor: $NAME_VAL"
            wget -O "./Dumpfile/$NAME_VAL" "$URL_VAL"
            file "./Dumpfile/$NAME_VAL"
            sleep 4
          else
            echo "bigfile_url.txt 'default' veya boş olarak ayarlanmış, indirme işlemi atlanıyor."
          fi
        else
          echo "bigfile_url.txt boş, indirme işlemi atlanıyor."
        fi

    
    - name: Run Ghidra Headless Analysis
      run: |
        mv ./Dumpfile/bilgi.txt /tmp/bilgi_temp.txt
        mv ./Dumpfile/bigfile_url.txt /tmp/bigfile_url_temp.txt
        mkdir -p /tmp/ghidra_proj
        $GHIDRA_HOME/support/analyzeHeadless /tmp/ghidra_proj TempProject -import ./Dumpfile -noanalysis -postScript ./scripts/asasec-ghidra.py
        mv /tmp/bilgi_temp.txt ./Dumpfile/bilgi.txt
        mv /tmp/bigfile_url_temp.txt ./Dumpfile/bigfile_url.txt

    - name: Zip and Prepare Artifact
      run: |
        mkdir -p /tmp/ghidra_out
        zip -r /tmp/ghidra_out/ghidra_project.zip /tmp/ghidra_proj

    - name: Sonuçları Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ghidra-analysis-report
        path: /tmp/ghidra_out/
