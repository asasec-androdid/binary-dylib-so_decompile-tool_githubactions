name: Ghidra Automated Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ghidra-scan:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Kopyala (Checkout)
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Download and Setup Ghidra
      run: |
        GHIDRA_VERSION="11.2.1"
        GHIDRA_DATE="20241105"
        wget https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_${GHIDRA_VERSION}_build/ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip
        unzip -q ghidra_${GHIDRA_VERSION}_PUBLIC_${GHIDRA_DATE}.zip
        echo "GHIDRA_HOME=$PWD/ghidra_${GHIDRA_VERSION}_PUBLIC" >> $GITHUB_ENV

    - name: Run Ghidra Headless Analysis
      run: |
        mkdir -p /tmp/ghidra_proj
        $GHIDRA_HOME/support/analyzeHeadless /tmp/ghidra_proj TempProject \
          -import ./superbear.dylib \
          -postScript ./scripts/asasec-ghidra.py

    - name: Zip and Prepare Artifact
      run: |
        mkdir -p /tmp/ghidra_out
        zip -r /tmp/ghidra_out/ghidra_project.zip /tmp/ghidra_proj

    - name: Sonuçları Kaydet (Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: ghidra-analysis-report
        path: /tmp/ghidra_out/
